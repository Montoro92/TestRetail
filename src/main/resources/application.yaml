server:
  port: 8080

spring:
  main:
    web-application-type: servlet
  application:
    name: test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop # se puede usar validation si tenemos el schema.sql para la creacion de las tablas (flyway)
    defer-datasource-initialization: true # hacemos esto para que haga el insert despues de la creacion de las tablas (entities)
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  swagger:
    server.url: http://localhost:${server.port}

springdoc:
  swagger-ui:
    configUrl: ../api-docs/swagger-config
    url: ../api-docs
  api-docs:
    path: /api-docs