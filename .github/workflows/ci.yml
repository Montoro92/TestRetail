name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - retail-development
  pull_request:
    branches:
      - main
      - develop
      - retail-development

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify